name: Run GH Follow Manager

on:
  schedule:
    # Spam scan: every day at 18:00 UTC
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode: spam | sync | all'
        required: false
        default: 'all'
      block_keep:
        description: 'Permanently block spam accounts? (true/false)'
        required: false
        default: 'true'

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests urllib3

      - name: Run GitHub Follow Manager
        env:
          GITHUB_USERNAME: ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          BLOCK_KEEP="${{ github.event.inputs.block_keep || 'true' }}"
          ARGS="--mode $MODE"
          if [ "$BLOCK_KEEP" = "true" ]; then
            ARGS="$ARGS --block-keep"
          fi
          python gh-follow-auto.py $ARGS
